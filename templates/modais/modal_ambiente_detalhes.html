<link rel="stylesheet" href="/static/Css/modal_detalhes_ambiente.css">

<div id="modal-detalhes-ambiente" class="modal" role="dialog" aria-modal="true" aria-labelledby="md-nome">
    <div class="modal-content">
        <span class="close" onclick="fecharModalDetalhesAmbiente()" role="button" aria-label="Fechar" tabindex="0">&times;</span>

        <img id="md-imagem" alt="Foto do ambiente">

        <h2 id="md-nome"></h2>

        <div class="info">
            <p><strong>Status:</strong> <span id="md-status"></span></p>
            <p><strong>Capacidade:</strong> <span id="md-capacidade"></span></p>
            <p><strong>Localização:</strong> <span id="md-localizacao"></span></p>
        </div>

        <h4>Sobre o Ambiente</h4>
        <p id="md-descricao"></p>

        <div class="modal-recursos">
            <h4>Recursos</h4>
            <ul id="md-recursos"></ul>
        </div>
    </div>
</div>

<script src="/static/Javascript/detalhes_ambientes.js"></script>
